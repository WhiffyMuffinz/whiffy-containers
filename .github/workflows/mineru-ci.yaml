name: CI — Mineru

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "mineru/**"
      - ".github/workflows/**"

jobs:
  version-bump:
    runs-on: actions-runners-containers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check if version bump needed
        id: vars
        run: |
          CURRENT=$(cat mineru/VERSION)
          NEW_VERSION=$(/bin/bash mineru/version-bump.sh "$CURRENT")
          
          if [ "$CURRENT" = "$NEW_VERSION" ]; then
            echo "bump_needed=false" >> $GITHUB_OUTPUT
          else
            echo "bump_needed=true" >> $GITHUB_OUTPUT
            echo "tag=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "$NEW_VERSION" > mineru/VERSION
          fi

      - name: Commit version update
        if: steps.vars.outputs.bump_needed == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add mineru/VERSION
          if ! git diff --cached --quiet; then
            git commit -m "Bump mineru version to ${{ steps.vars.outputs.tag }}"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  build:
    needs:
      - version-bump
    uses: ./.github/workflows/build.yaml
    with:
      container: "mineru"
      push: true
    secrets: inherit

  status:
    runs-on: actions-runners-containers
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - build
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped"
