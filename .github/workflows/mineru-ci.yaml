name: CI — Mineru

on:
  pull_request:
    paths:
      - "mineru/**"
      - ".github/workflows/**"

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      container: "mineru"
      push: false
    secrets: inherit
  
  ci-success:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
