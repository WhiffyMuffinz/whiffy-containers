name: CI — Fileflows

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "fileflows/**"
      - ".github/workflows/**"

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      container: "fileflows"
      push: false
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  status:
    runs-on: actions-runners-containers
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - build
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped"
