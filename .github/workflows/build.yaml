name: Build Container

on:
  workflow_call:
    inputs:
      container:
        description: "Container name (e.g. fileflows, mineru)"
        required: true
        type: string
      push:
        description: "Push image to GHCR after a successful test"
        required: false
        default: false
        type: boolean
    outputs:
      image_tag:
        description: "Semver tag that was built (e.g. 26.03.12)"
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: actions-runners-containers
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve semver tag
        id: vars
        run: |
          # Extract upstream version from Dockerfile
          UPSTREAM=$(grep -oP '(?<=revenz/fileflows:)[^\s]+' ${{ inputs.container }}/Dockerfile | tail -1)
          if [ -z "$UPSTREAM" ]; then
            # Fallback: try to extract from FROM line for mineru
            UPSTREAM=$(grep -oP "(?<=mineru\[api\]>='?)[0-9.]+" ${{ inputs.container }}/Dockerfile | head -1)
          fi
          
          # Read current version from VERSION file
          CURRENT=$(cat ${{ inputs.container }}/VERSION)
          
          # Run version-bump.sh to determine new version
          NEW_VERSION=$(/bin/bash ${{ inputs.container }}/version-bump.sh "$CURRENT" "$UPSTREAM")
          
          echo "tag=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved tag: ${NEW_VERSION}"
          echo "Upstream: ${UPSTREAM}, Current: ${CURRENT}, New: ${NEW_VERSION}"
          
          # Update VERSION file with new version
          echo "$NEW_VERSION" > ${{ inputs.container }}/VERSION

      - name: Build image (load locally)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ./${{ inputs.container }}
          file: ./${{ inputs.container }}/Dockerfile
          load: true
          tags: whiffy-test:${{ inputs.container }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke tests
        run: |
          docker run --rm -i \
            --entrypoint bash \
            whiffy-test:${{ inputs.container }} \
            < ./${{ inputs.container }}/test.sh

      - name: Generate bot token
        if: ${{ inputs.push }}
        id: bot-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
            app-id: ${{ secrets.VERSION_BOT_APP_ID }}
            private-key: ${{ secrets.VERSION_BOT_PRIVATE_KEY }}

      - name: Commit version update
        if: ${{ inputs.push }}
        env:
            GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          git config --global user.name "whiffy-version-bot[bot]"
          git config --global user.email "whiffy-version-bot[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          git add ${{ inputs.container }}/VERSION
          if [ -f "${{ inputs.container }}/VERSION.deps" ]; then
            git add ${{ inputs.container }}/VERSION.deps
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Bump ${{ inputs.container }} version to ${{ steps.vars.outputs.tag }}"
            git push
          fi


      - name: Tag and push to GHCR
        if: ${{ inputs.push }}
        env:
          IMAGE: ghcr.io/${{ secrets.GHCR_USERNAME }}/whiffys-custom-${{ inputs.container }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker tag whiffy-test:${{ inputs.container }} ${IMAGE}:${TAG}
          docker tag whiffy-test:${{ inputs.container }} ${IMAGE}:latest
          docker push ${IMAGE}:${TAG}
          docker push ${IMAGE}:latest
          echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:latest"
