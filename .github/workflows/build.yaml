name: Build Container

on:
  workflow_call:
    inputs:
      container:
        description: "Container name (e.g. fileflows, mineru)"
        required: true
        type: string
      push:
        description: "Push image to GHCR after a successful test"
        required: false
        default: false
        type: boolean
    outputs:
      image_tag:
        description: "Semver tag that was built (e.g. 26.03.12)"
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: actions-runners-containers
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch everything so we can compare the PR branch to main
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve semver tag
        id: vars
        run: |
          CURRENT_VERSION=$(cat ${{ inputs.container }}/VERSION)
          WILL_COMMIT=false
          FINAL_TAG=$CURRENT_VERSION

          # Logic: Only attempt a bump if this is a Pull Request
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Ensure we have the base branch to compare against
            git fetch origin ${{ github.base_ref }} --quiet

            # Check if the VERSION file has already been changed in this PR branch
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "${{ inputs.container }}/VERSION"; then
              echo "Check: VERSION file already updated in this PR. Skipping script."
            else
              echo "Check: VERSION file is untouched. Running version-bump.sh..."
              
              # 1. Extract upstream version
              UPSTREAM=$(grep -oP '(?<=revenz/fileflows:)[^\s]+' ${{ inputs.container }}/Dockerfile | tail -1)
              if [ -z "$UPSTREAM" ]; then
                UPSTREAM=$(grep -oP "(?<=mineru\[api\]>='?)[0-9.]+" ${{ inputs.container }}/Dockerfile | head -1)
              fi
              
              # 2. Run your existing script
              NEW_VERSION=$(/bin/bash ${{ inputs.container }}/version-bump.sh "$CURRENT_VERSION" "$UPSTREAM")
              
              # 3. Apply changes locally
              echo "$NEW_VERSION" > ${{ inputs.container }}/VERSION
              FINAL_TAG=$NEW_VERSION
              WILL_COMMIT=true
              echo "New version calculated: $NEW_VERSION"
            fi
          fi

          # Export variables for subsequent steps
          echo "tag=${FINAL_TAG}" >> $GITHUB_OUTPUT
          echo "will_commit=${WILL_COMMIT}" >> $GITHUB_OUTPUT

      - name: Build image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./${{ inputs.container }}
          file: ./${{ inputs.container }}/Dockerfile
          load: true
          tags: whiffy-test:${{ inputs.container }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke tests
        run: |
          docker run --rm -i \
            --entrypoint bash \
            whiffy-test:${{ inputs.container }} \
            < ./${{ inputs.container }}/test.sh

      - name: Scan image with Grype
        if: ${{ github.event_name == 'pull_request' }}
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: "whiffy-test:${{ inputs.container }}"
          output-format: json
          fail-build: false

      - name: Comment Grype summary on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          JSON_PATH: ${{ steps.scan.outputs.json }}
          CONTAINER_NAME: ${{ inputs.container }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.JSON_PATH, 'utf8'));
            const matches = report.matches || [];

            const severityOrder = ['Critical', 'High', 'Medium', 'Low', 'Negligible', 'Unknown'];
            const counts = {};
            const bySev = {};
            for (const match of matches) {
              const sev = (match.vulnerability && match.vulnerability.severity) || 'Unknown';
              counts[sev] = (counts[sev] || 0) + 1;
              if (!bySev[sev]) bySev[sev] = [];
              bySev[sev].push(match);
            }

            const sorted = [];
            for (const sev of severityOrder) {
              if (bySev[sev]) {
                bySev[sev].sort((a, b) =>
                  ((a.vulnerability && a.vulnerability.id) || '').localeCompare((b.vulnerability && b.vulnerability.id) || ''));
                for (const match of bySev[sev]) sorted.push(match);
              }
            }

            const total = matches.length;
            const lines = [];
            lines.push(`## Grype Security Scan - ${process.env.CONTAINER_NAME}`);
            lines.push('');
            lines.push(total === 0 ? 'No known vulnerabilities detected.' : `**${total} vulnerabilities found:**`);
            lines.push('');
            lines.push('| Severity | Count |');
            lines.push('| --- | --- |');
            for (const sev of severityOrder) {
              if (counts[sev]) lines.push(`| ${sev} | ${counts[sev]} |`);
            }

            if (total > 0) {
              lines.push('');
              lines.push('<details>');
              lines.push('<summary>View vulnerabilities</summary>');
              lines.push('');
              lines.push('| Severity | ID | Package | Version | Fixed in |');
              lines.push('| --- | --- | --- | --- | --- |');
              const top = sorted.slice(0, 20);
              for (const match of top) {
                const vuln = match.vulnerability || {};
                const artifact = match.artifact || {};
                const fixed = (vuln.fix && vuln.fix.versions && vuln.fix.versions.length)
                  ? vuln.fix.versions.join(', ')
                  : '-';
                lines.push(`| ${vuln.severity || 'Unknown'} | ${vuln.id || '-'} | ${artifact.name || '-'} | ${artifact.version || '-'} | ${fixed} |`);
              }
              if (total > top.length) lines.push(`| ... | | | | _${total - top.length} more_ |`);
              lines.push('</details>');
            }

            const marker = '<!-- grype-scan-summary -->';
            const body = marker + '\n' + lines.join('\n');
            const { owner, repo } = context.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: github.event.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: github.event.pull_request.number,
                body,
              });
              console.log('Created new comment');
            }

      - name: Commit version update
        if: ${{ steps.vars.outputs.will_commit == 'true' }}
        run: |
          # Use the standard GitHub Actions Bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add ${{ inputs.container }}/VERSION
          if [ -f "${{ inputs.container }}/VERSION.deps" ]; then
            git add ${{ inputs.container }}/VERSION.deps
          fi
          
          # Only commit and push if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore(${{ inputs.container }}): bump version to ${{ steps.vars.outputs.tag }}"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No changes detected in VERSION file. Skipping commit."
          fi
      - name: Tag and push to GHCR
        if: ${{ inputs.push }}
        env:
          IMAGE: ghcr.io/${{ secrets.GHCR_USERNAME }}/whiffys-custom-${{ inputs.container }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker tag whiffy-test:${{ inputs.container }} ${IMAGE}:${TAG}
          docker tag whiffy-test:${{ inputs.container }} ${IMAGE}:latest
          docker push ${IMAGE}:${TAG}
          docker push ${IMAGE}:latest
          echo "Successfully pushed ${IMAGE}:${TAG}"
