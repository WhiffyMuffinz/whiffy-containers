name: Build & Push — Fileflows

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [main]
    paths:
      - "fileflows/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-fileflows
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      container: "fileflows"
      push: true
    secrets: inherit
